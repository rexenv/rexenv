# The Linux x86_64 release artefacts, built ON THE FLOOR — a build-only workflow, no release.
#
# rexenv supports Ubuntu 22.04+ (docs/PLAN-linux-port.md D-L4). A deb is only as portable
# as the glibc it was linked against: the Dell's WSL Ubuntu 26.04 produces a deb that PROVES
# x86_64 works and RUNS on nothing older than 26.04. So the artefacts a user downloads are
# built on `ubuntu-22.04`, the oldest runner GitHub still offers and exactly the floor —
# the same rule the macOS build follows with its deployment target.
#
# Manual only. It uploads `rexenv_<V>_amd64.deb` + `.AppImage` (+ `.sha256`) as a run
# artifact; attaching them to a tap release is the human's step (docs/RELEASING.md 3b).
# `release.yml`'s `release-linux` job is the same steps on a tag; this exists so the floor
# build can be made and inspected without cutting a release.
name: Linux build (x86_64, Ubuntu 22.04 floor)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: pnpm release:linux on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 on Linux links webkit2gtk 4.1 + gtk3 through pkg-config. 22.04's names
      # (`libfuse2`, not 24.04's `libfuse2t64`); the AppImage bundler needs FUSE only to
      # RUN the image, and §A0-linux runs it extract-and-run, so it is here for linuxdeploy.
      - name: Install the webview and bundler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates pkg-config file dpkg-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libfuse2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        run: |
          # The version comes from rust-toolchain.toml (never `stable`).
          rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            cli

      - name: Build the deb + AppImage (+ §A0-linux)
        run: pnpm release:linux

      # The floor, PROVEN off the binary rather than assumed from the runner: the highest
      # GLIBC_ symbol version the executable asks for must be one Ubuntu 22.04's glibc
      # (2.35) has. A build that quietly picked up a newer symbol would install on 22.04
      # and die at exec, exactly the failure this workflow exists to prevent.
      - name: Assert the glibc floor (≤ 2.35, Ubuntu 22.04)
        run: |
          set -euo pipefail
          for f in src-tauri/target/release/rexenv src-tauri/target/release/rex; do
            max="$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)"
            echo "$f asks for glibc ≤ $max"
            [ "$(printf '%s\n2.35\n' "$max" | sort -V | tail -1)" = "2.35" ] || { echo "::error::$f needs glibc $max, above the 22.04 floor (2.35)"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rexenv-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/rexenv_*_amd64.deb
            src-tauri/target/release/bundle/deb/rexenv_*_amd64.deb.sha256
            src-tauri/target/release/bundle/appimage/rexenv_*_amd64.AppImage
            src-tauri/target/release/bundle/appimage/rexenv_*_amd64.AppImage.sha256
          if-no-files-found: error
          retention-days: 14
