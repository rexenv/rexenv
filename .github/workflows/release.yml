# Release pipeline — tag (or run from the Actions tab) → universal dmg → DRAFT release.
#
# The release is created as a DRAFT on purpose: CI can prove everything about the
# artefact EXCEPT the one publish-blocking gate that needs a human at a real Mac —
# docs/PUBLISH-TESTING.md §A (quarantine → Gatekeeper block → xattr -rd → launches).
# Flow: this workflow drafts the release with the dmg attached; you download the
# asset, run §A on it, then click "Publish release" on GitHub. Publishing fires
# the tap's own update-cask.yml (in rexenv/homebrew-tap), which bumps the Homebrew
# cask from the PUBLISHED asset's hash — see docs/RELEASING.md.
#
# Two ways to start a release, both end in the same draft:
#   1. git tag v<version> && git push origin v<version>
#   2. Actions tab → "Release" → Run workflow → type the version (creates the tag
#      for you; tags pushed with the workflow token do not re-trigger this).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0 — must match tauri.conf.json)"
        required: true

permissions:
  contents: write # create the tag (dispatch path) + the draft release

jobs:
  release:
    name: Build universal dmg and draft the release
    runs-on: macos-14
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # ── One version, everywhere. A tag that disagrees with the configs would
      #    ship a dmg whose filename and cask URL never match — fail loudly first.
      #
      #    The check itself lives in `scripts/check-versions.sh`, not here: this
      #    workflow does not run while the repo is private, so for every release
      #    so far the guard has been in the one place that never executed. The
      #    local build now runs the same script, and one implementation cannot
      #    drift from the other.
      - name: Check the tag matches every declared version
        run: ./scripts/check-versions.sh "${TAG#v}"

      - name: Create and push the tag (dispatch path only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists locally"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists on origin"
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          else
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      # No `version:` — pnpm/action-setup reads `packageManager` from package.json,
      # so CI runs the pnpm this repo declares. Pinning 11 here while developers ran
      # 12 made `pnpm list --prod` report 112 packages against the notices file's 127
      # (21 Sep 2026): a red bar on Windows CI that no machine could reproduce.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust (both Apple targets)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            cli

      # ── The pre-commit bar, run as the release bar too. verify.sh refuses a
      #    piped stdout by design; the file redirect is its sanctioned form and
      #    `exit $code` carries the real verdict.
      - name: verify.sh (lib tests + examples + clippy + tsc)
        run: |
          set -uo pipefail
          ./scripts/verify.sh > verify.log 2>&1
          code=$?
          cat verify.log
          exit $code

      - name: Build the universal dmg
        run: pnpm release:mac

      # ── docs/PUBLISH-TESTING.md §A0, the automatable half: a universal binary
      #    is two binaries in a trench coat, and anything embedded at compile
      #    time is embedded per slice. Add a line here whenever something new is
      #    compiled into the binary.
      - name: "§A0 artefact integrity — per-slice checks"
        run: |
          set -euo pipefail
          V="${TAG#v}"
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/rexenv.app"
          DMG="src-tauri/target/universal-apple-darwin/release/bundle/dmg/rexenv_${V}_universal.dmg"
          test -f "$DMG" || { echo "::error::expected dmg not found: $DMG" >&2; ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/ >&2; exit 1; }
          [ "$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | wc -l)" -eq 1 ]

          [ "$(lipo -archs "$APP/Contents/MacOS/rexenv")" = "x86_64 arm64" ]
          [ "$(lipo -archs "$APP/Contents/MacOS/rex")" = "x86_64 arm64" ]

          # Embedded payloads must be in EACH slice on its own, not merely
          # somewhere in the fat binary (a half-populated fat binary is invisible
          # to `lipo -archs`). Today's list: the vendored `wp dist-archive` tree.
          for arch in arm64 x86_64; do
            lipo -thin "$arch" "$APP/Contents/MacOS/rexenv" -output "/tmp/rexenv-$arch"
            n=$(strings -a "/tmp/rexenv-$arch" | grep -c Dist_Archive_Command || true)
            rm -f "/tmp/rexenv-$arch"
            [ "$n" -gt 0 ] || { echo "::error::Dist_Archive_Command missing from the $arch slice" >&2; exit 1; }
            echo "slice $arch: Dist_Archive_Command x$n"
          done

          codesign --verify --deep --strict "$APP"
          echo "§A0: all green"

      # ── The update archive, and §A0 re-run on the bundle that comes back OUT
      #    of it. `pnpm release:mac` already ran this (release-mac.sh calls it),
      #    so this step is a no-op that fails loudly if the build did not — one
      #    implementation, checked from both entry points.
      - name: Update archive + §A0 on the extracted bundle
        run: ./scripts/release-assets.sh --check

      - name: Draft the release with the dmg attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          DMG="src-tauri/target/universal-apple-darwin/release/bundle/dmg/rexenv_${V}_universal.dmg"
          shasum -a 256 "$DMG" | awk '{print $1 "  rexenv_'"$V"'_universal.dmg"}' > "rexenv_${V}_universal.dmg.sha256"
          cat "rexenv_${V}_universal.dmg.sha256"
          # The update archive rides along: an in-app update downloads a
          # BUNDLE, not a dmg. Its name must never end in `_universal.dmg` —
          # the tap's update-cask.yml selects the cask's asset by that suffix
          # and would hash whichever it found first.
          TAR="src-tauri/target/universal-apple-darwin/release/bundle/macos/rexenv_${V}_universal.app.tar.gz"
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "rexenv $V" \
            --generate-notes \
            --notes "> ⚠️ Draft until docs/PUBLISH-TESTING.md §A (Apple-Silicon launch gate) passes on this exact dmg. Publishing this release auto-updates the Homebrew cask in rexenv/homebrew-tap, and is the gate that makes the update archive reachable — a draft's assets 404 for everyone." \
            "$DMG" "rexenv_${V}_universal.dmg.sha256" \
            "$TAR" "$TAR.sha256"
          echo "draft release $TAG created — run §A on the attached dmg, then publish it"

  # ── The Windows half. It ATTACHES to the draft the macOS job created rather
  #    than creating its own: one release, one tag, both platforms' assets.
  #
  #    **This job has never run.** The repo is private, so neither has the one
  #    above — and that is exactly why the substance lives in scripts instead of
  #    in these steps. `release-windows.sh` (the pre-clean + the nsis-only build)
  #    and `release-windows-check.sh` (the §A0 half: one installer, the sidecar,
  #    the PE architecture, the embedded payload, and NotSigned) were measured on
  #    a real Windows machine 19 Sep 2026, plants included. What is unproven here
  #    is the YAML, not the release.
  release-windows:
    name: Build the Windows installer and attach it to the draft
    needs: release
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches every declared version
        run: ./scripts/check-versions.sh "${TAG#v}"

      # No `version:` — pnpm/action-setup reads `packageManager` from package.json,
      # so CI runs the pnpm this repo declares. Pinning 11 here while developers ran
      # 12 made `pnpm list --prod` report 112 packages against the notices file's 127
      # (21 Sep 2026): a red bar on Windows CI that no machine could reproduce.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            cli

      # ── The same bar as the macOS job, deliberately. A Windows job that runs
      #    LESS than verify.sh is a weaker gate nobody declared — the mistake
      #    ledger #684 records, where the Windows check was `cargo check` beside a
      #    macOS `clippy -D warnings`. If this proves too slow on a hosted runner,
      #    the answer is to make the bar faster or split it openly, not to quietly
      #    run a subset here.
      - name: verify.sh (lib tests + examples + clippy + tsc)
        run: |
          set -uo pipefail
          ./scripts/verify.sh > verify.log 2>&1
          code=$?
          cat verify.log
          exit $code

      - name: Build the installer (pre-clean + nsis only + §A0-windows)
        run: pnpm release:win

      - name: Attach the installer to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          SETUP="src-tauri/target/release/bundle/nsis/rexenv_${V}_x64-setup.exe"
          ZIP="src-tauri/target/release/bundle/nsis/rexenv_${V}_x64.zip"
          sha256sum "$SETUP" | awk '{print $1 "  rexenv_'"$V"'_x64-setup.exe"}' > "rexenv_${V}_x64-setup.exe.sha256"
          cat "rexenv_${V}_x64-setup.exe.sha256" "$ZIP.sha256"
          # The update archive rides along: an in-app update downloads the install
          # directory's contents, not the installer. Neither name ends in
          # `_universal.dmg`, which is the suffix the tap's update-cask.yml selects by.
          gh release upload "$TAG" "$SETUP" "rexenv_${V}_x64-setup.exe.sha256" "$ZIP" "$ZIP.sha256" --clobber
          echo "attached the Windows installer and update archive to draft $TAG"

  # ── The Linux half, x86_64. It ATTACHES to the draft the macOS job created, like
  #    the Windows job: one release, one tag, three platforms' assets.
  #
  #    x86_64 ONLY here. GitHub's arm64 Linux runners (`ubuntu-24.04-arm`) are free on
  #    public repos and a paid larger-runner on private ones, so the aarch64 pair is
  #    built on the Ubuntu VM with `pnpm release:linux` and uploaded by hand — the same
  #    "built locally" answer the dmg has today (docs/RELEASING.md 3b). The substance
  #    lives in the scripts, measured on the VM 25 Sep 2026: `release-linux.sh` (the
  #    build + the DNS-agent restart) and `release-linux-check.sh` (§A0-linux: one deb
  #    + one AppImage for the version and THIS arch, the rex sidecar, the ELF arch, the
  #    embedded payload + update key, the deb's control fields, members, polkit action
  #    and Depends, and BOTH artefacts answering --print-version — the facts the in-app
  #    updater re-checks on the user's machine before it swaps).
  release-linux:
    name: Build the Linux deb + AppImage (x86_64) and attach them to the draft
    needs: release
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches every declared version
        run: ./scripts/check-versions.sh "${TAG#v}"

      # Tauri 2 on Linux links webkit2gtk 4.1 + gtk3 through pkg-config; the list is
      # the check image's (scripts/linux-check/Dockerfile) plus what the bundlers need.
      - name: Install the webview and bundler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates pkg-config file dpkg-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libfuse2t64

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            cli

      # The same bar as the other two jobs (ledger #684's lesson: a lane that runs
      # less than verify.sh is a weaker gate nobody declared). On a Linux host
      # linux-check.sh lints natively and windows-check.sh is SKIPPED (no cargo-xwin).
      - name: verify.sh (lib tests + examples + clippy + tsc)
        run: |
          set -uo pipefail
          ./scripts/verify.sh > verify.log 2>&1
          code=$?
          cat verify.log
          exit $code

      - name: Build the deb + AppImage (+ §A0-linux)
        run: pnpm release:linux

      - name: Attach the deb and AppImage to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          DEB="src-tauri/target/release/bundle/deb/rexenv_${V}_amd64.deb"
          IMG="src-tauri/target/release/bundle/appimage/rexenv_${V}_amd64.AppImage"
          cat "$DEB.sha256" "$IMG.sha256"
          # Neither name ends in `_universal.dmg`, the suffix the tap's update-cask.yml
          # selects by; the in-app updater's four Linux descriptors name these files
          # UNRENAMED (runtimes' publish-app-manifest.sh --linux).
          gh release upload "$TAG" "$DEB" "$DEB.sha256" "$IMG" "$IMG.sha256" --clobber
          echo "attached the x86_64 deb and AppImage to draft $TAG"
