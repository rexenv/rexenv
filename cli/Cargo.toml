[package]
name = "rexenv-cli"
version = "0.8.9"
description = "rex — remote control for the running rexenv app"
license = "Apache-2.0"
edition = "2021"

# STRUCTURAL second-brain guarantee (do not relitigate): this crate must NEVER
# depend on the app lib (rexenv_lib) or any service/DB machinery. It cannot
# open the app SQLite or spawn/stop services — it can only write one JSON
# request line to the running app's private socket and print the reply. That
# makes the examples-stop-the-edge bug class impossible at compile time.
[dependencies]
serde_json = "1"
# The Windows pipe's name is a digest of the app's config folder, computed the app's way (plan §5 W8,
# ruling Q1). Hashing only: it reaches nothing of the app's.
sha2 = "0.10"

# The Windows transport (plan §5 W8, ruling Q5): an overlapped named-pipe client. A blocking handle deadlocks a
# reader and a writer on two threads (measured on the Dell, `windows_cli_pipe_probe` (d)). macOS's rex does
# not link it.
[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time"] }

[[bin]]
name = "rex"
path = "src/main.rs"
