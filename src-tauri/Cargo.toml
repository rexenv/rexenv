[package]
name = "rexenv"
version = "0.1.0"
description = "A native, lightweight, no-Docker local development environment"
authors = ["rexenv"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rexenv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
thiserror = "2"
directories = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
async-trait = "0.1"
hickory-server = "0.24"
hickory-proto = "0.24"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
