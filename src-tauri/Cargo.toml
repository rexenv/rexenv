[package]
name = "rexenv"
version = "0.8.7"
description = "A native, lightweight, no-Docker local development environment"
authors = ["rexenv"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rexenv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `tray-icon` = the menu-bar status item; `image-png` = decoding the template
# icon we embed for it (`Image::from_bytes`). rexenv lives in the menu bar
# because `rex` and the MCP server are remote controls for a RUNNING app —
# their sockets open in this process and die with it.
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
thiserror = "2"
directories = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
async-trait = "0.1"
hickory-server = "0.24"
hickory-proto = "0.24"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
# ed25519 verification for the PHP update manifest (core/updates.rs). ALREADY in
# the normal dependency tree transitively via rcgen — this is a direct
# declaration of a crate that was going to be compiled anyway, not a new entry
# into the supply chain.
ring = "0.17"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
# The Windows artifacts (Caddy, PHP, nginx, MySQL, Mailpit) ship as zips —
# docs/PLAN-windows-port.md W2. Extraction only: no default features, and deflate
# goes through the flate2 above rather than a second compressor.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
sysinfo = "0.36.1"
portable-pty = "0.9"
base64 = "0.22"
tauri-plugin-dialog = "2"
# Read-only parsing of our own issued certs (Settings tab cert info); also used by tests.
x509-parser = "0.16"
mysql_async = { version = "0.37.0", default-features = false, features = ["minimal-rust"] }

# Native JS dialog panels for the webview (platform/macos/webview_dialogs.rs) —
# wry implements no WKUIDelegate JS dialogs on macOS. Versions match wry's own
# transitive deps, so nothing new enters the tree.
[target.'cfg(target_os = "macos")'.dependencies]
# kqueue `EVFILT_PROC`/`NOTE_EXIT` for the tunnel guard (platform/macos/parent_death_guard.rs):
# macOS has no PR_SET_PDEATHSIG, so "the share dies with the app even when the app is
# SIGKILLed" needs a watcher process, and a watcher that POLLS is a timer pretending to
# be an event. ALREADY in the tree transitively (sysinfo, tokio, ring …) — this is a
# direct declaration of a crate that was going to be compiled anyway.
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", features = [
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSTextField",
    "NSView",
    "NSWindow",
] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKUIDelegate", "objc2-app-kit"] }

[dev-dependencies]
# MockRuntime app for cli_server tests + the cli_socket_check example — lets us
# exercise the real command dispatch without a GUI event loop.
tauri = { version = "2.11.3", features = ["test"] }
# manifest_sweep_check probes every pinned URL and re-hashes the small
# artifacts; same versions/features as [dependencies], so nothing new compiles.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"

# webview_dialogs_check builds a REAL WKWebView + a wry-shaped stub delegate to
# prove the panel installation mechanics (ledger #166 leg B). Same versions as
# [dependencies]; WKWebViewConfiguration is the one extra feature it needs.
# The panic hook's message box on a Windows release build (platform/windows
# `fatal_notice`, ledger #596) — a `windows_subsystem = "windows"` process has no
# console. ALREADY in the Windows graph at this version with these features
# (tao/wry), so this declares a crate that was compiled anyway; the macOS graph
# is unchanged.
# MySQL's generic Linux tarball is `.tar.xz` (docs/PLAN-linux-port.md L2); liblzma is built
# from source (`static`) so the deb depends on no lzma package. Linux only — every other OS
# fetches no xz archive and `platform::xz_decoder` answers `Unsupported` there.
[target.'cfg(target_os = "linux")'.dependencies]
xz2 = { version = "0.1", features = ["static"] }
# pidfd_open/poll/kill for the tunnel guard (platform/linux/parent_death_guard.rs) — already in
# the tree transitively, declared directly as on macOS.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # Owner-only files (platform/windows/acl.rs, ledger #597): the current user's SID,
    # an SDDL descriptor, and a DACL set through a file handle. Security_Authorization
    # is the one feature not already on in the Windows graph — same crate, more bindings.
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    # The port gate and process identity (platform/windows/process.rs, ledger #599): the
    # socket tables, a process's command line, parent and services, the address families.
    # Same crate as above, more bindings — no new crate in the Windows graph.
    "Wdk_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Services",
    # Streamed steps (Composer, git, npm — platform/windows/process.rs, ledger #609): each step's
    # process tree in a kill-on-close Job Object, and the user's environment read fresh from the
    # registry. Same crate, more bindings.
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    # The local CA in this user's Root certificate store (platform/windows/cert_store.rs,
    # ledger #613): CertOpenStore / CertAddEncodedCertificateToStore / CertFindCertificateInStore /
    # CertDeleteCertificateFromStore. Same crate, more bindings.
    "Win32_Security_Cryptography",
    # The resolver's socket (platform/windows/resolver_socket.rs, ledger #615): WSAIoctl, which turns
    # UDP connection-reset reports off, is gated on this feature. Same crate, more bindings.
    "Win32_System_IO",
    # The DNS agent's output (platform/windows/agent_output.rs, ledger #616): SetStdHandle, so a
    # logon task's agent — which Task Scheduler gives no stdout or stderr — writes its log file.
    "Win32_System_Console",
    # The privileged step (platform/windows/elevation.rs, ledger #619): ShellExecuteExW with the runas verb,
    # which is what shows UAC for rexenv.exe. Same crate, more bindings.
    "Win32_UI_Shell",
    # The single-instance lock (W7 S1, plan §5 W7 ruling Q1): a named pipe created first-instance-only
    # with a current-user DACL — CreateNamedPipeW / ConnectNamedPipe. Same crate, more bindings.
    "Win32_System_Pipes",
    # Linked folders as junctions (W7 S6, platform/windows/junction.rs, ledger #625): FSCTL_SET_REPARSE_POINT,
    # sent with DeviceIoControl (already under System_IO). Same crate, more bindings.
    "Win32_System_Ioctl",
] }

# WebView2's own keyboard shortcuts (W9 S2, plan §5 W9 ruling Q2, ledger #637): Ctrl+R reloaded the whole
# app, because wry leaves `browser_accelerator_keys` at WebView2's default and tauri 2.11 does not surface
# the switch. `lib.rs` reaches the controller through `with_webview` and turns them off. Both crates are
# already in the Windows graph through wry — these lines make them ours to call, at wry's own versions.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

# Target-gated like the [dependencies] copies: objc2 is a compile_error! on any
# non-Apple target, and as a plain dev-dependency it failed EVERY test and example
# target of a Windows build before a line of ours was checked
# (docs/PLAN-windows-port.md §2.1, found by scripts/windows-check.sh).
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKUIDelegate", "WKWebViewConfiguration", "objc2-app-kit"] }
