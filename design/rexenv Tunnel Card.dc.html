<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@keyframes rexPing{0%{transform:scale(1);opacity:.5}70%{opacity:0}100%{transform:scale(2.7);opacity:0}}@keyframes rexSpin{to{transform:rotate(360deg)}}</style>
</helmet>
<div style="background:#15171D;border:1px solid {{t.cardBorder}};border-radius:13px;padding:14px 16px;box-shadow:{{t.cardGlow}};font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif">
  <div style="display:flex;align-items:center;gap:13px">
    <span style="width:34px;height:34px;flex:none;border-radius:9px;background:{{t.accentBg}};border:1px solid {{t.accentBorder}};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:{{t.accent}}">{{t.initial}}</span>
    <div style="flex:1;min-width:0">
      <div style="font-size:14px;font-weight:600;color:#E7E9EE">{{t.name}}</div>
      <div style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:#8A90A0;margin-top:2px">{{t.domain}}</div>
    </div>

    <sc-if value="{{t.isIdle}}" hint-placeholder-val="{{true}}"><span style="font-size:12px;color:#8A90A0;margin-right:2px">Share publicly</span></sc-if>
    <sc-if value="{{t.isStarting}}" hint-placeholder-val="{{false}}"><span style="display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#D7A93A;margin-right:2px"><span style="width:12px;height:12px;border-radius:50%;border:2px solid rgba(210,153,34,.32);border-top-color:#D29922;animation:{{t.spin}}"></span>Starting…</span></sc-if>
    <sc-if value="{{t.isLive}}" hint-placeholder-val="{{false}}"><span style="display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;border-radius:999px;background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.22);margin-right:2px"><span style="position:relative;display:inline-flex;width:7px;height:7px"><span style="position:absolute;inset:0;border-radius:50%;background:#3FB950;opacity:.5;animation:{{t.pulse}}"></span><span style="position:relative;width:7px;height:7px;border-radius:50%;background:#3FB950"></span></span><span style="font-size:11.5px;font-weight:500;color:#4FC065">Live</span></span></sc-if>

    <button role="switch" aria-checked="{{t.aria}}" aria-label="Share publicly" onClick="{{t.onToggle}}" style="position:relative;width:42px;height:25px;border-radius:999px;flex:none;background:{{t.trackBg}};border:1px solid {{t.trackBorder}};padding:0;cursor:pointer;transition:background .18s,border-color .18s" style-focus="outline:none;box-shadow:0 0 0 3px rgba(124,92,255,.45)"><span style="position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:{{t.knobBg}};transform:{{t.knob}};box-shadow:0 1px 2px rgba(0,0,0,.5);transition:transform .2s cubic-bezier(.4,0,.2,1)"></span></button>
  </div>

  <sc-if value="{{t.isLive}}" hint-placeholder-val="{{false}}">
    <div style="margin-top:13px">
      <div style="display:flex;align-items:center;gap:9px;background:#0B0C10;border:1px solid #1E222A;border-radius:10px;padding:8px 8px 8px 12px">
        <span style="display:flex;flex:none;color:#C9A24B"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" style="display:block"><path d="M17.5 19a4.5 4.5 0 0 0 .9-8.91A6 6 0 0 0 6.7 9.2 4 4 0 0 0 7 19z"></path></svg></span>
        <span style="flex:1;min-width:0;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:#9CC4E8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{t.url}}</span>
        <button onClick="{{t.onCopy}}" aria-label="Copy public URL" style="display:flex;align-items:center;gap:5px;height:28px;padding:0 9px;border-radius:7px;font-size:11px;color:{{t.copyColor}};cursor:pointer;transition:background .12s,color .12s" style-hover="background:rgba(255,255,255,.06)">
          <sc-if value="{{t.copied}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style="display:block"><polyline points="20 6 9 17 4 12"></polyline></svg>Copied</sc-if>
          <sc-if value="{{t.notCopied}}" hint-placeholder-val="{{true}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" style="display:block"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>Copy</sc-if>
        </button>
        <button onClick="{{t.onVisit}}" aria-label="Open public URL" style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;color:#8A90A0;cursor:pointer;transition:background .12s,color .12s" style-hover="background:rgba(255,255,255,.06);color:#E7E9EE"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" style="display:block"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></button>
        <button onClick="{{t.onStop}}" style="display:flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:7px;font-size:11.5px;font-weight:500;background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.24);color:#F0726B;cursor:pointer;transition:background .12s" style-hover="background:rgba(248,81,73,.14)"><svg width="11" height="11" viewBox="0 0 24 24" style="display:block"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor"></rect></svg>Stop sharing</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:9px;padding:0 2px"><span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;color:#5F6675">{{t.reqLabel}}</span><span style="flex:1"></span><span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;color:#5F6675">anyone with this link can reach your local site</span></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: &quot;560px&quot;, &quot;height&quot;: &quot;150px&quot;},
  &quot;t&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;object&quot;}
}"></script>
</body>
</html>
