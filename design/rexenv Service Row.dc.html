<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@keyframes rexPing{0%{transform:scale(1);opacity:.5}70%{opacity:0}100%{transform:scale(2.7);opacity:0}}</style>
</helmet>
<div style="display:flex;align-items:center;gap:14px;padding:0 16px;height:54px;border-bottom:1px solid #14171D;background:transparent;opacity:{{row.rowOpacity}};font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;transition:background .12s" style-hover="background:#181B22">
  <div style="flex:1;min-width:0;display:flex;align-items:center;gap:11px">
    <span style="width:30px;height:30px;flex:none;border-radius:8px;background:{{row.accentBg}};border:1px solid {{row.accentBorder}};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;font-weight:700;color:{{row.accent}}">{{row.badge}}</span>
    <div style="min-width:0">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:13.5px;font-weight:600;color:{{row.nameColor}}">{{row.name}}</span>
        <sc-if value="{{row.isDefault}}" hint-placeholder-val="{{false}}"><span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;color:#C9BCFF;background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.28);padding:2px 7px;border-radius:6px">default</span></sc-if>
        <sc-if value="{{row.isRouter}}" hint-placeholder-val="{{false}}"><span style="display:inline-flex;align-items:center;gap:4px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;color:#5FBFA8;background:rgba(45,156,143,.12);border:1px solid rgba(45,156,143,.28);padding:2px 7px;border-radius:6px">edge router</span></sc-if>
      </div>
      <div style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;color:#6E7681;margin-top:1px">{{row.version}}</div>
    </div>
  </div>

  <div style="width:62px;flex:none;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;color:{{row.portColor}}">{{row.port}}</div>

  <div style="width:132px;flex:none;display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;align-items:center;gap:7px"><span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:.06em;color:{{row.meterLabelColor}};width:22px">CPU</span><span style="flex:1;height:4px;border-radius:999px;background:#0B0C10;overflow:hidden"><span style="display:block;height:100%;width:{{row.cpuW}};border-radius:999px;background:linear-gradient(90deg,#6B4AE8,#9277FF);transition:width .8s ease"></span></span><span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;color:{{row.meterValColor}};width:32px;text-align:right">{{row.cpuVal}}</span></div>
    <div style="display:flex;align-items:center;gap:7px"><span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:.06em;color:{{row.meterLabelColor}};width:22px">RAM</span><span style="flex:1;height:4px;border-radius:999px;background:#0B0C10;overflow:hidden"><span style="display:block;height:100%;width:{{row.ramW}};border-radius:999px;background:linear-gradient(90deg,#6B4AE8,#9277FF);transition:width .8s ease"></span></span><span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;color:{{row.meterValColor}};width:32px;text-align:right">{{row.ramVal}}</span></div>
  </div>

  <div style="width:86px;flex:none"><span style="display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 8px;border-radius:999px;background:{{row.pillBg}};border:1px solid {{row.pillBorder}}"><span style="position:relative;display:inline-flex;width:6px;height:6px"><span style="position:absolute;inset:0;border-radius:50%;background:{{row.dot}};opacity:.5;animation:{{row.pillPulse}}"></span><span style="position:relative;width:6px;height:6px;border-radius:50%;background:{{row.dot}}"></span></span><span style="font-size:11px;font-weight:500;color:{{row.statusColor}}">{{row.statusLabel}}</span></span></div>

  <button role="switch" aria-checked="{{row.aria}}" aria-label="Start or stop service" onClick="{{row.onToggle}}" style="position:relative;width:38px;height:22px;border-radius:999px;flex:none;background:{{row.trackBg}};border:1px solid {{row.trackBorder}};padding:0;cursor:pointer;transition:background .18s,border-color .18s" style-focus="outline:none;box-shadow:0 0 0 3px rgba(124,92,255,.45)"><span style="position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:{{row.knobBg}};transform:{{row.knob}};box-shadow:0 1px 2px rgba(0,0,0,.5);transition:transform .2s cubic-bezier(.4,0,.2,1)"></span></button>

  <div style="width:138px;flex:none;display:flex;justify-content:flex-end">
    <sc-if value="{{row.canSetDefault}}" hint-placeholder-val="{{false}}"><button onClick="{{row.onSetDefault}}" style="height:29px;padding:0 12px;border-radius:8px;font-size:12px;font-weight:500;background:#1C1F27;border:1px solid #2E323C;color:#C9BCFF;cursor:pointer;transition:background .14s" style-hover="background:#232734">Set default</button></sc-if>
    <sc-if value="{{row.showAction}}" hint-placeholder-val="{{false}}"><button onClick="{{row.onAction}}" style="display:flex;align-items:center;gap:6px;height:29px;padding:0 12px;border-radius:8px;font-size:12px;font-weight:500;background:#1C1F27;border:1px solid #2E323C;color:#D5D8E0;cursor:pointer;transition:background .14s,border-color .14s" style-hover="background:#232734;border-color:#3B404C"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style="display:block"><path d="M9 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3"></path><path d="M14 4h6v6"></path><line x1="20" y1="4" x2="11" y2="13"></line></svg>{{row.actionLabel}}</button></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: &quot;640px&quot;, &quot;height&quot;: &quot;54px&quot;},
  &quot;row&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;object&quot;}
}"></script>
</body>
</html>
